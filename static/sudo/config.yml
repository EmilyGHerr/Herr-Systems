  - name: case_studies
    label: Case studies
    label_singular: Case study
    folder: content/case-studies
    path: "{{slug}}/index"
    create: true
    slug: "{{slug}}"
    extension: md
    format: yaml-frontmatter
    media_folder: /static/uploads
    public_folder: /uploads
    summary: "{{listing_title}} — {{title}}"
    fields:
      - name: title
        label: Page title
        widget: string
        hint: Plain-text page title. Used for default metadata and the URL when creating a study.
      - name: homepage
        label: Homepage display
        widget: object
        collapsed: false
        required: false
        hint: Choose whether this study appears on the homepage. Turning it off keeps the study published and listed on the Case Studies page.
        fields:
          - name: show
            label: Show on homepage
            widget: boolean
            required: false
            default: false
          - name: title
            label: Card title
            widget: string
            required: false
            hint: Blank uses the organization / listing title.
          - name: description
            label: Card summary
            widget: text
            required: false
            hint: Blank uses the page summary.
          - name: aria_label
            label: Accessible link description
            widget: string
            required: false
          - name: link_text
            label: Open case study link label
            widget: string
            required: false
            default: Explore the study →
      - name: slug
        label: URL slug (last path segment)
        widget: string
        required: false
        hint: Optional. Use lowercase words separated by hyphens, for example emily-herr. Changes the public
          URL, not this CMS entry or its source filename. Blank keeps the original filename-based
          slug.
        pattern:
          - ^$|^[a-z0-9]+(-[a-z0-9]+)*$
          - Use lowercase letters, numbers, and single hyphens.
      - name: url
        label: Full page path (optional override)
        widget: string
        required: false
        hint: "Optional. Overrides the slug. Use a path such as /about/emily-herr/ or /get-in-touch/ with
          leading and trailing slashes. No domain, spaces, query or #fragment. Leave blank for the
          default path. Avoid system paths such as /api/, /sudo/, /uploads/, and /staff/."
        pattern:
          - ^$|^/(?!api/|sudo/|assets/|uploads/|fonts/|staff/)([a-z0-9]+(-[a-z0-9]+)*/)+$
          - Use /lowercase-words/ with a trailing slash; system paths are reserved.
      - name: aliases
        label: Previous URLs (redirects)
        widget: list
        required: false
        hint: When changing a previously published custom URL, add its old path here. The original
          filename-based URL redirects automatically. Do not use the URL of another page.
        field:
          name: path
          label: Previous path
          widget: string
          pattern:
            - ^$|^/(?!api/|sudo/|assets/|uploads/|fonts/|staff/)([a-z0-9]+(-[a-z0-9]+)*/)+$
            - Use /lowercase-words/ with a trailing slash; system paths are reserved.
      - name: hero_title
        label: Billboard — display heading
        widget: text
        required: false
        hint: Large visible heading. Preserve intended <em> and <br> formatting.
      - name: subtitle
        label: Billboard — introductory text
        widget: text
        required: false
        hint: Visible below the main heading. Inline <em> and <br> are supported.
      - name: description
        label: Page summary (listing and default search preview)
        widget: text
        hint: Plain text. Used in listings, terminal search, and metadata unless overridden.
      - name: listing_title
        label: Card / project name
        widget: string
        required: false
        hint: Optional short name for directory and homepage cards. Blank uses the page title.
      - name: category
        label: Card category / service
        widget: string
        required: false
      - name: weight
        label: Listing order
        widget: number
        value_type: int
        default: 40
        required: false
      - name: image
        label: Cover and listing image
        widget: image
        required: false
        hint: Optional. Used as the detail cover and card image. No sample image is supplied for new
          studies.
