                    required: false
                    hint: Optional. Blank uses the page title followed by the site brand.
                  - name: description
                    label: Search result description
                    widget: text
                    required: false
                    hint: Optional. Blank uses the page summary. Write a useful 1–2 sentence preview.
                  - name: noindex
                    label: Hide this page from search engines
                    widget: boolean
                    required: false
                    default: false
                    hint: Also removes this page from the sitemap and terminal search. This does not make it private.
                  - name: canonicalURL
                    label: Canonical URL (advanced)
                    widget: string
                    required: false
                    hint: Normally leave blank. Only set a full https:// URL for another preferred source.
                    pattern:
                      - ^$|^https?://[^\s]+$
                      - Use a complete http(s) URL or leave blank.
              - name: social
                label: Link previews — image and social networks
                widget: object
                collapsed: true
                fields:
                  - name: image
                    label: Social preview image
                    widget: image
                    required: false
                    hint: Optional. Blank uses the shared default social image.
                  - name: imageAlt
                    label: Social image description
                    widget: string
                    required: false
                  - name: ogTitle
                    label: Facebook / LinkedIn title
                    widget: string
                    required: false
                    hint: Optional. Blank uses the search title.
                  - name: ogDescription
                    label: Facebook / LinkedIn description
                    widget: text
                    required: false
                    hint: Optional. Blank uses the search description.
                  - name: twitterTitle
                    label: X / Twitter title
                    widget: string
                    required: false
                    hint: Optional. Blank uses the search title.
                  - name: twitterDescription
                    label: X / Twitter description
                    widget: text
                    required: false
                    hint: Optional. Blank uses the search description.
            hint: These control previews, not the visible billboard. Blank overrides inherit defaults.
