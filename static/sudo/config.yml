          - name: slug
            label: URL slug (last path segment)
            widget: string
            required: false
            hint: Optional. Use lowercase words separated by hyphens, for example emily-herr. Changes the public
              URL, not this CMS entry or its source filename. Blank keeps the original
              filename-based slug.
            pattern:
              - ^$|^[a-z0-9]+(-[a-z0-9]+)*$
              - Use lowercase letters, numbers, and single hyphens.
          - name: url
            label: Full page path (optional override)
            widget: string
            required: false
            hint: "Optional. Overrides the slug. Use a path such as /about/emily-herr/ or /get-in-touch/ with
              leading and trailing slashes. No domain, spaces, query or #fragment. Leave blank for
              the default path. Avoid system paths such as /api/, /sudo/, /uploads/, and /staff/."
            pattern:
              - ^$|^/(?!api/|sudo/|assets/|uploads/|fonts/|staff/)([a-z0-9]+(-[a-z0-9]+)*/)+$
              - Use /lowercase-words/ with a trailing slash; system paths are reserved.
          - name: aliases
            label: Previous URLs (redirects)
            widget: list
            required: false
            hint: When changing a previously published custom URL, add its old path here. The original
              filename-based URL redirects automatically. Do not use the URL of another page.
            field:
              name: path
              label: Previous path
              widget: string
              pattern:
                - ^$|^/(?!api/|sudo/|assets/|uploads/|fonts/|staff/)([a-z0-9]+(-[a-z0-9]+)*/)+$
                - Use /lowercase-words/ with a trailing slash; system paths are reserved.
