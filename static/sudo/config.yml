  - name: hugo_config
    label: Site URL and build identity
    file: hugo.yaml
    fields:
    - name: baseURL
      label: Production site URL
      widget: string
      default: https://herrsystems.com/
    - name: languageCode
      label: languageCode
      widget: string
      default: en-us
    - name: title
      label: title
      widget: string
      default: Herr Systems
    - name: enableRobotsTXT
      label: enableRobotsTXT
      widget: hidden
      default: true
    - name: pagination
      label: pagination
      widget: hidden
      default:
        pagerSize: 10
    - name: outputs
      label: outputs
      widget: hidden
      default:
        home:
        - HTML
        - RSS
        - SearchIndex
    - name: outputFormats
      label: outputFormats
      widget: hidden
      default:
        SearchIndex:
          mediaType: application/json
          baseName: search-index
          isPlainText: true
          notAlternative: true
    - name: markup
      label: markup
      widget: hidden
      default:
        goldmark:
          renderer:
            unsafe: true
    - name: sitemap
      label: sitemap
      widget: hidden
      default:
        changeFreq: monthly
        filename: sitemap.xml
    - name: params
      label: params
      widget: hidden
      default:
        noindex: false
    - name: disableKinds
      label: disableKinds
      widget: hidden
      default:
      - taxonomy
      - term
