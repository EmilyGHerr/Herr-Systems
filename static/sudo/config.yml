                    required: false
                    default: "#contact"
                    hint: "Use /contact/ for a site page, #contact for a homepage section, or a full https:// address.
                      mailto: and tel: links are also supported. Blank uses #contact."
                    pattern:
                      - ^$|^(?:/(?!/)|#|https?://|mailto:|tel:)\S*$
                      - "Use a site path starting with /, a #section, or an http://, https://,
                        mailto: or tel: link without spaces."
