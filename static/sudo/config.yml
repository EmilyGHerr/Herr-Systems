            label: Additional home URLs (redirects to /)
            widget: list
            required: false
            hint: The homepage always lives at /. Add previous or alternative paths here to redirect visitors to
              the homepage.
            field:
              name: path
              label: Previous path
              widget: string
              pattern:
                - ^$|^/(?!api/|sudo/|assets/|uploads/|fonts/|staff/)([a-z0-9]+(-[a-z0-9]+)*/)+$
                - Use /lowercase-words/ with a trailing slash; system paths are reserved.
          - name: seo
            label: Search engines and social sharing
            widget: object
            collapsed: true
            fields:
