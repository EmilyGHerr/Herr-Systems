name: Build isolated brutalist dev preview
on:
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.5'
          extended: true
      - name: Build static preview only
        run: hugo --gc --minify --baseURL https://herrsystems.com/
      - name: Check preview isolation
        run: python3 tests/preview-isolation.py
      - uses: actions/upload-artifact@v4
        with:
          name: herr-systems-brutalist-dev
          path: public
