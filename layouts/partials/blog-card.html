{{ $p := .page }}{{ $featured := .featured }}<article class="{{ if $featured }}post-feature{{ else }}post-card{{ end }}" data-interactive-card><a class="post-image-link" href="{{ $p.RelPermalink }}"><img src="{{ $p.Params.image }}" alt="{{ $p.Params.image_alt }}" width="1200" height="630" {{ if not $featured }}loading="lazy"{{ end }}></a><div class="{{ if $featured }}post-feature-copy{{ else }}post-card-copy{{ end }}"><div class="post-meta"><span>{{ $p.Params.category }}</span><span aria-hidden="true">/</span><span>{{ $p.Params.reading_label }}</span></div>{{ if $featured }}<h2 id="featured-title"><a href="{{ $p.RelPermalink }}">{{ $p.Title }}</a></h2>{{ else }}<h3><a href="{{ $p.RelPermalink }}">{{ $p.Title }}</a></h3>{{ end }}<p>{{ $p.Description }}</p><a class="{{ if $featured }}button{{ else }}plain-link{{ end }}" data-card-link href="{{ $p.RelPermalink }}">{{ $p.Site.Data.settings.blog_read }} {{ if $featured }}<b aria-hidden="true">»</b>{{ else }}→{{ end }}</a></div></article>
